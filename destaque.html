            <input
              type="search"
              id="buscar"
              name="q"
              placeholder="Buscar"
              autocomplete="off"
              enterkeyhint="search"
            />
            <button
              type="submit"
              class="btn-secondary search-form__submit"
              aria-label="Buscar"
            >
              <span class="search-form__submit-label">Buscar</span>
              <i
                class="fa-solid fa-magnifying-glass search-form__submit-icon"
                aria-hidden="true"
              ></i>
            </button>
          </form>

          <a href="#" class="btn-secondary btn-login">Entrar</a>

          <button
            class="menu-toggle"
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="main-nav"
